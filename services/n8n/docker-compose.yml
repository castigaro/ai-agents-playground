services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
      - N8N_HOST=${N8N_DOMAIN:-n8n.example.tld}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN:-n8n.example.tld}/
      - WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.example.tld}/
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - proxy

networks:
  # Netz des vorhandenen nginx-proxy-managers, der TLS und Domain bedient.
  proxy:
    name: ${PROXY_NETWORK:-ngnx-proxy-manager_default}
    external: true

volumes:
  n8n_data:
